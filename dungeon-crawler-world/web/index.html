<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Eighteen floors, a timer on each, and an audience of trillions.">
<title>Dungeon Crawler World</title>
<style>
/*
 * One column, thumb-first, no external requests.
 *
 * The feed scrolls; everything else is fixed furniture. The action rail sits
 * above the input because on a phone the bottom third of the screen is the
 * only part you can reach without moving your hand.
 */
:root {
  --bg: #0b0d10;
  --panel: #12161b;
  --panel-2: #171d24;
  --edge: #232c36;
  --ink: #dfe5ec;
  --dim: #8b97a5;
  --good: #7fd08a;
  --bad: #e0685f;
  --loot: #d9b45c;
  --hot: #d96a3f;
  --hp: #c8493f;
  --mp: #4f7fc4;
  --safe: max(env(safe-area-inset-bottom), 8px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 ui-serif, Georgia, "Times New Roman", serif;
  overscroll-behavior: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
}

/* ------------------------------------------------------------------ hud */

#hud {
  flex: 0 0 auto;
  padding: max(env(safe-area-inset-top), 6px) 12px 8px;
  background: linear-gradient(#12161b, #0e1216);
  border-bottom: 1px solid var(--edge);
}

#hudtop { display: flex; align-items: baseline; gap: 8px; }
#name { font-weight: 600; font-size: 17px; letter-spacing: .2px; }
#sub { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.clock {
  font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 4px 7px;
  border: 1px solid var(--edge);
  border-radius: 5px;
  color: var(--dim);
  white-space: nowrap;
}
.clock.warn { color: var(--loot); border-color: #4a3d1e; }
.clock.urgent { color: var(--bad); border-color: #4c2521; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.track {
  position: relative;
  height: 13px;
  margin-top: 6px;
  background: #080a0d;
  border: 1px solid var(--edge);
  border-radius: 3px;
  overflow: hidden;
}
.fill { height: 100%; width: 100%; transition: width .3s ease; }
#hp-fill { background: linear-gradient(90deg, #8e2f28, var(--hp)); }
#mp-fill { background: linear-gradient(90deg, #2f4d7d, var(--mp)); }
.tracktext {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 600 10px/1 ui-monospace, Menlo, monospace;
  color: #eef3f8;
  text-shadow: 0 1px 2px #000;
  letter-spacing: .4px;
}

#chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
#chips:empty { margin-top: 0; }
.chip {
  font: 11px/1 ui-sans-serif, system-ui, sans-serif;
  padding: 4px 7px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--edge);
  color: var(--dim);
}
.chip.good { color: var(--good); border-color: #24402a; }
.chip.bad { color: var(--bad); border-color: #472522; }
.chip.loot { color: var(--loot); border-color: #46381b; }

/* ----------------------------------------------------------------- feed */

#feed {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 4px;
  overscroll-behavior: contain;
}

.line { margin: 0 0 11px; }
.line.narration { color: var(--ink); }
.line.system { color: var(--dim); font-size: 14px; font-family: ui-sans-serif, system-ui, sans-serif; }
.line.good { color: var(--good); }
.line.bad { color: var(--bad); }
.line.loot { color: var(--loot); }
.line.announce {
  color: #eaf0f6;
  border-left: 2px solid var(--loot);
  padding-left: 10px;
  font-style: italic;
}
.line.combat { color: #cfd8e2; }

/* -------------------------------------------------------------- actions */

#where {
  flex: 0 0 auto;
  padding: 6px 14px;
  font: 600 11px/1.4 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .9px;
  text-transform: uppercase;
  color: var(--dim);
  border-top: 1px solid var(--edge);
  background: #0e1216;
}

#actions {
  flex: 0 0 auto;
  max-height: 42dvh;
  overflow-y: auto;
  padding: 8px 10px;
  background: var(--panel);
  border-top: 1px solid var(--edge);
  overscroll-behavior: contain;
}

.act {
  display: block;
  width: 100%;
  margin: 0 0 6px;
  padding: 12px 13px;
  text-align: left;
  font: 15px/1.3 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
.act:active { background: #202832; transform: translateY(1px); }
.act[disabled] { opacity: .4; }
.act.good { border-color: #2c4a33; color: var(--good); }
.act.danger { border-color: #4c2b26; color: #f0a79e; }
.act.loot { border-color: #4a3c1c; color: var(--loot); }
.act.feature { border-color: #3c3352; color: #c3aef0; }
.act.unknown { color: var(--dim); font-style: italic; }
.act.on { border-color: var(--good); color: var(--good); background: #16241a; }
.act.small {
  display: inline-block;
  width: auto;
  margin: 0 5px 5px 0;
  padding: 8px 11px;
  font-size: 13px;
}

.gorow { display: flex; gap: 6px; align-items: flex-start; }
.gorow .act { margin-bottom: 6px; }
.gorow .act.small { flex: 0 0 auto; align-self: stretch; }

.actrow { display: flex; flex-wrap: wrap; gap: 0; margin-top: 4px; }

.sep {
  margin: 10px 0 6px;
  font: 600 10px/1 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #5d6a78;
  border-top: 1px solid var(--edge);
  padding-top: 8px;
}
.sep:empty { padding-top: 8px; }

.hint {
  font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
  color: var(--dim);
  margin: 0 2px 8px;
}

/* ---------------------------------------------------------------- zones */

.zones { margin-bottom: 8px; }

.zone {
  padding: 8px 10px;
  margin-bottom: 5px;
  background: #0e1318;
  border: 1px solid var(--edge);
  border-left: 3px solid var(--edge);
  border-radius: 7px;
}
.zone.here { border-left-color: var(--good); background: #101a14; }
.zname { font: 600 12px/1.35 ui-sans-serif, system-ui, sans-serif; color: #b6c2cf; }
.zwho { font: 13px/1.4 ui-serif, Georgia, serif; color: var(--dim); margin-top: 2px; }
.zone .act { margin-top: 6px; }

.foe {
  padding: 9px 11px;
  margin-bottom: 7px;
  background: #140f10;
  border: 1px solid #332323;
  border-radius: 8px;
}
.foehead { display: flex; align-items: baseline; gap: 8px; }
.foename { font-weight: 600; flex: 1; }
.foehp { font: 11px/1 ui-monospace, Menlo, monospace; color: var(--dim); }
.minibar {
  height: 4px;
  margin: 5px 0 6px;
  background: #080a0d;
  border-radius: 2px;
  overflow: hidden;
}
.minifill { height: 100%; background: linear-gradient(90deg, #6e241f, var(--hp)); transition: width .3s; }
.foebtns { display: flex; flex-wrap: wrap; align-items: center; }
.foe .hint { margin-bottom: 5px; }

/* ---------------------------------------------------------------- input */

#bar {
  flex: 0 0 auto;
  display: flex;
  gap: 7px;
  padding: 8px 10px calc(6px + var(--safe));
  background: var(--panel);
  border-top: 1px solid var(--edge);
}
#input {
  flex: 1;
  min-width: 0;
  padding: 12px 13px;
  font: 15px/1.2 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: #0a0d11;
  border: 1px solid var(--edge);
  border-radius: 9px;
}
#input::placeholder { color: #5b6674; }
#input:focus { outline: none; border-color: #3a4a5a; }
#send {
  flex: 0 0 auto;
  padding: 12px 16px;
  font: 600 15px/1.2 ui-sans-serif, system-ui, sans-serif;
  color: #0b0d10;
  background: #9fb3c7;
  border: none;
  border-radius: 9px;
  cursor: pointer;
}
#send[disabled] { opacity: .35; }

#tabs {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--edge);
  background: #0e1216;
  padding-bottom: var(--safe);
}
#tabs button {
  flex: 1;
  padding: 10px 2px;
  font: 11px/1.2 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .3px;
  color: var(--dim);
  background: none;
  border: none;
  cursor: pointer;
}
#tabs button:active { color: var(--ink); background: #151b21; }

/* --------------------------------------------------------------- sheets */

#sheet, #intake {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  flex-direction: column;
  background: #0b0d10;
}
#sheet.open, #intake.open { display: flex; }

#sheet-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: max(env(safe-area-inset-top), 10px) 14px 10px;
  border-bottom: 1px solid var(--edge);
  background: var(--panel);
}
#sheet-title { flex: 1; font-weight: 600; font-size: 17px; }
#sheet-close {
  padding: 8px 14px;
  font: 15px/1 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  cursor: pointer;
}
#sheet-body, #intake-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px calc(20px + var(--safe));
}

.srow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid #161c23;
}
.sleft { flex: 1; min-width: 0; }
.sright {
  flex: 0 0 auto;
  text-align: right;
  color: var(--dim);
  font: 13px/1.3 ui-sans-serif, system-ui, sans-serif;
}
.sright .act.small { margin: 0 0 0 4px; }

.srow.r-uncommon .sleft { color: #79c68b; }
.srow.r-rare .sleft { color: #6fa8dc; }
.srow.r-epic .sleft { color: #b083e0; }
.srow.r-legendary .sleft { color: var(--loot); }
.srow.r-celestial .sleft { color: #f0803c; text-shadow: 0 0 12px #7a3a12; }

.death {
  font: 700 26px/1.2 ui-serif, Georgia, serif;
  color: var(--bad);
  margin: 6px 0 10px;
  letter-spacing: .4px;
}

#intake-body h2 { font: 600 22px/1.3 ui-serif, Georgia, serif; margin: 4px 0 10px; }
.field {
  display: block;
  width: 100%;
  margin: 6px 0 12px;
  padding: 12px 13px;
  font: 16px/1.4 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: #0a0d11;
  border: 1px solid var(--edge);
  border-radius: 9px;
}
textarea.field { min-height: 110px; resize: vertical; }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + var(--safe));
  z-index: 40;
  transform: translate(-50%, 14px);
  max-width: min(90vw, 460px);
  padding: 11px 15px;
  font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: #1b232c;
  border: 1px solid var(--edge);
  border-radius: 10px;
  box-shadow: 0 8px 24px #0009;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (min-width: 700px) {
  #actions { max-height: 34dvh; }
  .act.small { font-size: 14px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="hudtop">
      <span id="name">—</span>
      <span id="sub"></span>
      <span id="clock" class="clock">—</span>
    </div>
    <div class="track"><div id="hp-fill" class="fill"></div><div id="hp-text" class="tracktext"></div></div>
    <div class="track"><div id="mp-fill" class="fill"></div><div id="mp-text" class="tracktext"></div></div>
    <div id="chips"></div>
  </header>

  <main id="feed"></main>

  <div id="where"></div>
  <div id="actions"></div>

  <div id="bar">
    <input id="input" autocomplete="off" autocapitalize="sentences" autocorrect="off"
           placeholder="or say what you actually do…">
    <button id="send">Do</button>
  </div>

  <nav id="tabs">
    <button id="tab-inv">Pack</button>
    <button id="tab-sheet">Crawler</button>
    <button id="tab-skills">Skills</button>
    <button id="tab-spells">Spells</button>
    <button id="tab-craft">Bench</button>
    <button id="tab-map">Floor</button>
    <button id="tab-menu">Menu</button>
  </nav>
</div>

<div id="sheet">
  <div id="sheet-head">
    <span id="sheet-title"></span>
    <button id="sheet-close">Close</button>
  </div>
  <div id="sheet-body"></div>
</div>

<div id="intake">
  <div id="intake-body"></div>
</div>

<div id="toast"></div>
