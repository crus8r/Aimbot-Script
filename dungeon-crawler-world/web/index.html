<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0b0d10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Eighteen floors, a timer on each, and an audience of trillions.">
<title>Dungeon Crawler World</title>
<style>
/*
 * One column, thumb-first, no external requests.
 *
 * The feed scrolls; everything else is fixed furniture. The action rail sits
 * above the input because on a phone the bottom third of the screen is the
 * only part you can reach without moving your hand.
 */
:root {
  --bg: #0b0d10;
  --panel: #12161b;
  --panel-2: #171d24;
  --edge: #232c36;
  --ink: #dfe5ec;
  --dim: #8b97a5;
  --good: #7fd08a;
  --bad: #e0685f;
  --loot: #d9b45c;
  --hot: #d96a3f;
  --hp: #c8493f;
  --mp: #4f7fc4;
  --safe: max(env(safe-area-inset-bottom), 8px);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

/*
 * Two layout modes, because this page does not always own the window.
 *
 * Standalone it is an app: a fixed-height column with its own scrolling feed.
 * Embedded in a host that wraps it — an artifact frame, an iframe sized to its
 * content — it must be a flow document instead. A page that pins itself to
 * 100dvh inside a frame the parent sizes from `scrollHeight` reports back
 * exactly the height it was given, so the frame never grows, the app is stuck
 * in whatever box it started in, and the bottom of it is simply unreachable.
 * That is what put the tab bar off the bottom of a real phone.
 *
 * `html.framed` is set by the client before first paint.
 */
html {
  /* iOS inflates text in frames whose layout width does not match the window,
     which overflows the HUD row and collapses the feed. Never wanted here. */
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  /* The host may declare itself light. This page is not. */
  color-scheme: dark;
}

html, body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 ui-serif, Georgia, "Times New Roman", serif;
}

/* App mode: we own the window, so nothing outside the feed scrolls. */
html:not(.framed), html:not(.framed) body {
  height: 100%;
  overflow: hidden;
  overscroll-behavior: none;
}

#app {
  display: flex;
  flex-direction: column;
  height: 100dvh;
  max-width: 720px;
  margin: 0 auto;
}

/*
 * Flow mode. The app declares a real height so the host's auto-sizer has a
 * number to grow to, and the host page does the scrolling.
 */
html.framed #app {
  height: auto;
  min-height: var(--framed-height, 720px);
}
html.framed #feed {
  /* No independent scroll pane inside a page that is already scrolling. */
  overflow-y: visible;
  max-height: none;
  min-height: calc(var(--framed-height, 720px) * 0.42);
}
html.framed #actions { max-height: none; overflow-y: visible; }
html.framed #hud { position: sticky; top: 0; z-index: 5; }
html.framed #bar { position: sticky; bottom: 0; z-index: 5; }

/*
 * Long unbroken text — a pasted URL, an item name, a crawler name somebody
 * typed forty characters into — must never widen the page.
 */
#feed, .line, .hint, .sleft, .zname, .zwho, .foename, #name, #sheet-body, #intake-body {
  overflow-wrap: anywhere;
  word-break: break-word;
}
#hudtop > * { min-width: 0; }
#name { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ------------------------------------------------------------------ hud */

#hud {
  flex: 0 0 auto;
  padding: max(env(safe-area-inset-top), 6px) 12px 8px;
  background: linear-gradient(#12161b, #0e1216);
  border-bottom: 1px solid var(--edge);
}

#hudtop { display: flex; align-items: baseline; gap: 8px; }
#name { font-weight: 600; font-size: 17px; letter-spacing: .2px; }
#sub { color: var(--dim); font-size: 12px; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.clock {
  font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
  padding: 4px 7px;
  border: 1px solid var(--edge);
  border-radius: 5px;
  color: var(--dim);
  white-space: nowrap;
}
.clock.warn { color: var(--loot); border-color: #4a3d1e; }
.clock.urgent { color: var(--bad); border-color: #4c2521; animation: pulse 1.8s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }

.track {
  position: relative;
  height: 13px;
  margin-top: 6px;
  background: #080a0d;
  border: 1px solid var(--edge);
  border-radius: 3px;
  overflow: hidden;
}
.fill { height: 100%; width: 100%; transition: width .3s ease; }
#hp-fill { background: linear-gradient(90deg, #8e2f28, var(--hp)); }
#mp-fill { background: linear-gradient(90deg, #2f4d7d, var(--mp)); }
.tracktext {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font: 600 10px/1 ui-monospace, Menlo, monospace;
  color: #eef3f8;
  text-shadow: 0 1px 2px #000;
  letter-spacing: .4px;
}

#chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
#chips:empty { margin-top: 0; }
.chip {
  font: 11px/1 ui-sans-serif, system-ui, sans-serif;
  padding: 4px 7px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--edge);
  color: var(--dim);
}
.chip.good { color: var(--good); border-color: #24402a; }
.chip.bad { color: var(--bad); border-color: #472522; }
.chip.loot { color: var(--loot); border-color: #46381b; }

/* ----------------------------------------------------------------- feed */

#feed {
  flex: 1 1 auto;
  /* A text RPG whose prose pane collapses to 90px is not a text RPG. */
  min-height: 34dvh;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px 4px;
  overscroll-behavior: contain;
}

.line { margin: 0 0 11px; }
.line.narration { color: var(--ink); }
.line.system { color: var(--dim); font-size: 14px; font-family: ui-sans-serif, system-ui, sans-serif; }
.line.good { color: var(--good); }
.line.bad { color: var(--bad); }
.line.loot { color: var(--loot); }
.line.announce {
  color: #eaf0f6;
  border-left: 2px solid var(--loot);
  padding-left: 10px;
  font-style: italic;
}
.line.combat { color: #cfd8e2; }

/* -------------------------------------------------------------- actions */

#where {
  flex: 0 0 auto;
  padding: 6px 14px;
  font: 600 11px/1.4 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .9px;
  text-transform: uppercase;
  color: var(--dim);
  border-top: 1px solid var(--edge);
  background: #0e1216;
}

#actions {
  flex: 0 1 auto;
  max-height: 42dvh;
  overflow-y: auto;
  padding: 8px 10px;
  background: var(--panel);
  border-top: 1px solid var(--edge);
  overscroll-behavior: contain;
}

.act {
  display: block;
  width: 100%;
  margin: 0 0 6px;
  padding: 12px 13px;
  text-align: left;
  font: 15px/1.3 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  cursor: pointer;
  touch-action: manipulation;
}
.act:active { background: #202832; transform: translateY(1px); }
.act[disabled] { opacity: .4; }
.act.good { border-color: #2c4a33; color: var(--good); }
.act.danger { border-color: #4c2b26; color: #f0a79e; }
.act.loot { border-color: #4a3c1c; color: var(--loot); }
.act.feature { border-color: #3c3352; color: #c3aef0; }
.act.unknown { color: var(--dim); font-style: italic; }
.act.on { border-color: var(--good); color: var(--good); background: #16241a; }
.act.small {
  display: inline-block;
  width: auto;
  min-height: 44px;
  margin: 0 5px 5px 0;
  padding: 8px 12px;
  font-size: 13px;
}
/* The same class was 45.5px in a .gorow and 34.9px everywhere else. One size. */
.gorow .act.small { align-self: auto; }

.gorow { display: flex; gap: 6px; align-items: flex-start; }
.gorow .act { margin-bottom: 6px; }
.gorow .act.small { flex: 0 0 auto; align-self: stretch; }

.actrow { display: flex; flex-wrap: wrap; gap: 0; margin-top: 4px; }

.sep {
  margin: 10px 0 6px;
  font: 600 10px/1 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: 1.2px;
  text-transform: uppercase;
  color: #5d6a78;
  border-top: 1px solid var(--edge);
  padding-top: 8px;
}
.sep:empty { padding-top: 8px; }

.hint {
  font: 13px/1.45 ui-sans-serif, system-ui, sans-serif;
  color: var(--dim);
  margin: 0 2px 8px;
}

/* ---------------------------------------------------------------- zones */

.zones { margin-bottom: 8px; }

.zone {
  padding: 8px 10px;
  margin-bottom: 5px;
  background: #0e1318;
  border: 1px solid var(--edge);
  border-left: 3px solid var(--edge);
  border-radius: 7px;
}
.zone.here { border-left-color: var(--good); background: #101a14; }
.zname { font: 600 12px/1.35 ui-sans-serif, system-ui, sans-serif; color: #b6c2cf; }
.zwho { font: 13px/1.4 ui-serif, Georgia, serif; color: var(--dim); margin-top: 2px; }
.zone .act { margin-top: 6px; }

.foe {
  padding: 9px 11px;
  margin-bottom: 7px;
  background: #140f10;
  border: 1px solid #332323;
  border-radius: 8px;
}
.foehead { display: flex; align-items: baseline; gap: 8px; }
.foename { font-weight: 600; flex: 1; }
.foehp { font: 11px/1 ui-monospace, Menlo, monospace; color: var(--dim); }
.minibar {
  height: 4px;
  margin: 5px 0 6px;
  background: #080a0d;
  border-radius: 2px;
  overflow: hidden;
}
.minifill { height: 100%; background: linear-gradient(90deg, #6e241f, var(--hp)); transition: width .3s; }
.foebtns { display: flex; flex-wrap: wrap; align-items: center; }
.foe .hint { margin-bottom: 5px; }

/* ---------------------------------------------------------------- input */

#bar {
  flex: 0 0 auto;
  display: flex;
  gap: 7px;
  padding: 8px 10px calc(6px + var(--safe));
  background: var(--panel);
  border-top: 1px solid var(--edge);
}
#input {
  flex: 1;
  min-width: 0;
  padding: 12px 13px;
  /* Under 16px, iOS Safari zooms the page on focus. */
  font: 16px/1.2 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: #0a0d11;
  border: 1px solid var(--edge);
  border-radius: 9px;
}
#input::placeholder { color: #5b6674; }
#input:focus { outline: none; border-color: #3a4a5a; }
#send {
  flex: 0 0 auto;
  padding: 12px 16px;
  font: 600 15px/1.2 ui-sans-serif, system-ui, sans-serif;
  color: #0b0d10;
  background: #9fb3c7;
  border: none;
  border-radius: 9px;
  cursor: pointer;
}
#send[disabled] { opacity: .35; }

#tabs {
  flex: 0 0 auto;
  display: flex;
  border-top: 1px solid var(--edge);
  background: #0e1216;
  padding-bottom: var(--safe);
}
#tabs button {
  flex: 1;
  min-height: 48px;
  padding: 10px 2px;
  font: 11px/1.2 ui-sans-serif, system-ui, sans-serif;
  letter-spacing: .3px;
  color: var(--dim);
  background: none;
  border: none;
  cursor: pointer;
}
#tabs button:active { color: var(--ink); background: #151b21; }

/* --------------------------------------------------------------- sheets */

#sheet, #intake {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: none;
  flex-direction: column;
  background: #0b0d10;
}
#sheet.open, #intake.open { display: flex; }

#sheet-head {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: max(env(safe-area-inset-top), 10px) 14px 10px;
  border-bottom: 1px solid var(--edge);
  background: var(--panel);
}
#sheet-title { flex: 1; font-weight: 600; font-size: 17px; }
#sheet-close {
  min-height: 44px;
  min-width: 76px;
  padding: 10px 16px;
  font: 15px/1 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: var(--panel-2);
  border: 1px solid var(--edge);
  border-radius: 8px;
  cursor: pointer;
}
#sheet-body, #intake-body {
  flex: 1 1 auto;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  padding: 14px 14px calc(20px + var(--safe));
}

.srow {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid #161c23;
}
.sleft { flex: 1; min-width: 0; }
.sright {
  flex: 0 0 auto;
  text-align: right;
  color: var(--dim);
  font: 13px/1.3 ui-sans-serif, system-ui, sans-serif;
}
.sright .act.small { margin: 0 0 0 4px; }

.srow.r-uncommon .sleft { color: #79c68b; }
.srow.r-rare .sleft { color: #6fa8dc; }
.srow.r-epic .sleft { color: #b083e0; }
.srow.r-legendary .sleft { color: var(--loot); }
.srow.r-celestial .sleft { color: #f0803c; text-shadow: 0 0 12px #7a3a12; }

.death {
  font: 700 26px/1.2 ui-serif, Georgia, serif;
  color: var(--bad);
  margin: 6px 0 10px;
  letter-spacing: .4px;
}

#intake-body h2 { font: 600 22px/1.3 ui-serif, Georgia, serif; margin: 4px 0 10px; }
.field {
  display: block;
  width: 100%;
  margin: 6px 0 12px;
  padding: 12px 13px;
  font: 16px/1.4 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: #0a0d11;
  border: 1px solid var(--edge);
  border-radius: 9px;
}
textarea.field { min-height: 110px; resize: vertical; }

#toast {
  position: fixed;
  left: 50%;
  bottom: calc(84px + var(--safe));
  z-index: 40;
  transform: translate(-50%, 14px);
  max-width: min(90vw, 460px);
  padding: 11px 15px;
  font: 14px/1.4 ui-sans-serif, system-ui, sans-serif;
  color: var(--ink);
  background: #1b232c;
  border: 1px solid var(--edge);
  border-radius: 10px;
  box-shadow: 0 8px 24px #0009;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s, transform .2s;
}
#toast.show { opacity: 1; transform: translate(-50%, 0); }

:where(button, input, textarea, [tabindex]):focus-visible {
  outline: 2px solid #7fa8d8;
  outline-offset: 2px;
}

/* The global tap-highlight kill left two controls with no press feedback. */
#send:active { background: #7e93a6; }
#sheet-close:active, #tabs button:active { background: #202832; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: .001ms !important;
  }
}

@media (min-width: 700px) {
  #actions { max-height: 34dvh; }
  .act.small { font-size: 14px; }
}
</style>
</head>
<body>
<div id="app">
  <header id="hud">
    <div id="hudtop">
      <span id="name">—</span>
      <span id="sub"></span>
      <span id="clock" class="clock">—</span>
    </div>
    <div class="track"><div id="hp-fill" class="fill"></div><div id="hp-text" class="tracktext"></div></div>
    <div class="track"><div id="mp-fill" class="fill"></div><div id="mp-text" class="tracktext"></div></div>
    <div id="chips"></div>
  </header>

  <main id="feed" role="log" aria-live="polite" aria-label="What is happening"></main>

  <div id="where"></div>
  <div id="actions"></div>

  <div id="bar">
    <input id="input" aria-label="Say what you actually do" autocomplete="off" autocapitalize="sentences" autocorrect="off"
           placeholder="or say what you actually do…">
    <button id="send" aria-label="Do it">Do</button>
  </div>

  <nav id="tabs">
    <button id="tab-inv">Pack</button>
    <button id="tab-sheet">Crawler</button>
    <button id="tab-skills">Skills</button>
    <button id="tab-spells">Spells</button>
    <button id="tab-craft">Bench</button>
    <button id="tab-map">Floor</button>
    <button id="tab-menu">Menu</button>
  </nav>
</div>

<div id="sheet">
  <div id="sheet-head">
    <span id="sheet-title"></span>
    <button id="sheet-close">Close</button>
  </div>
  <div id="sheet-body"></div>
</div>

<div id="intake">
  <div id="intake-body"></div>
</div>

<div id="toast"></div>

ly thing on the floor that stops what the deeper floors put out.",occurs:{zones:["high"],floors:[4,99],chance:.2,units:[1,3]}},{id:"zinc_stock",name:"Zinc",unit:"sheet",tags:["metal","malleable","reactive"],kg:1.9,value:16,structural:!1,tool:"cutting",minutes:9,dc:9,desc:"Galvanising, peeled off in dull grey curls. Reactive enough to be interesting and cheap enough to waste finding out.",occurs:{zones:["water","exposed"],floors:[2,99],chance:.2,units:[1,4]}},{id:"alu_stock",name:"Aluminium",unit:"offcut",tags:["metal","malleable","reactive","conductive"],kg:.9,value:18,structural:!1,tool:"cutting",minutes:8,dc:8,desc:"Window frames, ladders, and the trim off a hundred thousand shopfronts. Harmless in a sheet. Not harmless as a powder.",occurs:{zones:[],floors:[2,99],chance:.26,units:[1,4]}},{id:"rust",name:"Iron Scale",unit:"scrape",tags:["oxide","granular","oxidiser"],kg:.5,value:2,structural:!1,tool:null,minutes:3,dc:4,desc:"Flakes off anything that has been damp for a season. It is iron that has already found its oxygen and would very much like to give it to something else.",occurs:{zones:["water","rubble"],chance:.5,units:[2,7]}},{id:"slag",name:"Furnace Slag",unit:"lump",tags:["oxide","granular","refractory"],kg:3.1,value:2,structural:!1,tool:"percussion",minutes:6,dc:6,desc:"Glassy, blistered, and dumped by whatever was smelting down here before the dungeon was. Useless and heat-proof, which is not the same as useless.",occurs:{nodes:["lair","vault"],floors:[3,99],chance:.3,units:[2,6]}},{id:"timber",name:"Timber",unit:"beam",tags:["organic","fibrous","combustible"],kg:5.8,value:2,structural:!0,tool:"cutting",minutes:14,dc:8,desc:"Joists, pallets, and shoring. Dry as a bone down here and it knows it.",occurs:{zones:["flammable","rubble"],chance:.5,units:[2,6]}},{id:"coal",name:"Coal",unit:"sack",tags:["organic","combustible","granular"],kg:4.4,value:6,structural:!1,tool:null,minutes:6,dc:5,desc:"Seams in the wall on the older floors, or somebody's stockpile. Burns hot and long, which is the only way to get a fire to do work rather than make light.",occurs:{zones:["dark","confined"],floors:[2,99],chance:.3,units:[2,8]}},{id:"tar",name:"Tar",unit:"pot",tags:["organic","combustible","volatile"],kg:2.3,value:9,structural:!1,tool:null,minutes:7,dc:6,desc:"Seeping out of a joint or left in a bucket by whoever was fixing the roof when the sky went. Sticks, spreads, and does not go out politely.",occurs:{zones:["flammable"],chance:.3,units:[1,4]}},{id:"resin",name:"Resin",unit:"wad",tags:["organic","combustible","volatile"],kg:.6,value:14,structural:!1,tool:"edge",minutes:6,dc:7,desc:"Weeping out of whatever is growing through the wall. Sticky, aromatic, and it takes a light off a spark.",occurs:{zones:["flammable","dark"],floors:[2,99],chance:.24,units:[1,4]}},{id:"tallow",name:"Rendered Fat",unit:"block",tags:["organic","combustible"],kg:1.5,value:7,structural:!1,tool:null,minutes:5,dc:5,desc:"Off something that was recently upright. Candles, grease, soap, and a slow steady flame that will not go out in a draught.",occurs:{nodes:["lair"],chance:.35,units:[1,4]}},{id:"rope_fibre",name:"Raw Fibre",unit:"hank",tags:["organic","fibrous","combustible"],kg:.4,value:3,structural:!1,tool:null,minutes:4,dc:4,desc:"Unravelled off something that was holding something else up. Cordage, wick, wadding, tinder.",occurs:{zones:[],chance:.4,units:[2,6]}},{id:"nitre",name:"Wall Nitre",unit:"scrape",tags:["salt","oxidiser","crystalline","hygroscopic"],kg:.3,value:26,structural:!1,tool:null,minutes:9,dc:8,desc:"White furring on old damp stone where the wall has been quietly making it out of everything that has died against it. Every powder mill in history started with somebody scraping this off a cellar.",occurs:{zones:["confined","dark","water"],chance:.28,units:[1,5]}},{id:"sulphur",name:"Sulphur",unit:"lump",tags:["sulphide","combustible","brittle","toxic"],kg:.8,value:30,structural:!1,tool:"percussion",minutes:8,dc:9,desc:"Yellow crust around anything venting hot. Smells like the floor is warning you, because it is.",occurs:{zones:["exposed","rubble"],floors:[4,99],chance:.25,units:[1,4]}},{id:"rock_salt",name:"Rock Salt",unit:"lump",tags:["salt","crystalline","hygroscopic"],kg:1.2,value:5,structural:!1,tool:"percussion",minutes:5,dc:5,desc:"Seams of it, tasting of exactly what it is. Preserves, melts ice, ruins metal, and carries a current once it is wet.",occurs:{zones:["water","dark"],chance:.25,units:[2,6]}},{id:"ash",name:"Wood Ash",unit:"scoop",tags:["oxide","granular","alkaline"],kg:.7,value:2,structural:!1,tool:null,minutes:3,dc:3,desc:"Whatever burned here last. Soak it and pour off the water and you have something that will take the skin off your hands, which people have known for six thousand years.",occurs:{zones:["flammable"],chance:.45,units:[2,8]}},{id:"glass_cullet",name:"Broken Glass",unit:"double handful",tags:["silicate","brittle","crystalline"],kg:1.1,value:2,structural:!1,tool:null,minutes:4,dc:6,desc:"There was a lot of glass on Earth and all of it arrived here at once.",occurs:{zones:[],chance:.4,units:[2,8]}},{id:"bone_stock",name:"Bone",unit:"armful",tags:["organic","carbonate","brittle"],kg:1.8,value:3,structural:!1,tool:null,minutes:5,dc:5,desc:"Some of it is not human and some of it is. Burn it white and it is lime and phosphate, which is a rude thing to know about a friend.",occurs:{nodes:["lair","shrine","vault"],chance:.4,units:[2,6]}},{id:"chitin",name:"Chitin Plate",unit:"plate",tags:["organic","fibrous","refractory"],kg:1.3,value:18,structural:!1,tool:"edge",minutes:10,dc:9,desc:"Off the things down here that came with their own armour. Light, stiff, and it laughs at a flame.",occurs:{nodes:["lair"],floors:[2,99],chance:.35,units:[1,4]}},{id:"spore_cap",name:"Spore Cap",unit:"cap",tags:["organic","toxic","volatile"],kg:.3,value:24,structural:!1,tool:null,minutes:6,dc:8,desc:"Growing where the dead are. Burst it in a confined space and everything in the room finds out at the same time.",occurs:{zones:["dark","confined"],floors:[2,99],chance:.24,units:[1,4]}},{id:"ichor",name:"Ichor",unit:"flask",tags:["organic","reactive","toxic","volatile"],kg:.5,value:45,structural:!1,tool:"fine",minutes:12,dc:12,desc:"Drained carefully out of something that was using it. Still warm, still moving slightly, and it eats through the wrong container in about an hour.",occurs:{nodes:["lair"],floors:[3,99],chance:.22,units:[1,3]}},{id:"mana_shard",name:"Mana Shard",unit:"shard",tags:["crystalline","reactive","purified"],kg:.2,value:90,structural:!1,tool:"fine",minutes:18,dc:14,desc:"Grown, not formed. Holds a charge that is not electrical and does not leak, and the dungeon prices it accordingly.",occurs:{nodes:["shrine","vault"],floors:[3,99],chance:.18,units:[1,2]}},{id:"quicklime",name:"Quicklime",unit:"measure",tags:["oxide","alkaline","caustic","calcined","hygroscopic","reactive","powdered"],kg:1.1,value:55,desc:"What limestone becomes when it has been held hot for long enough to drive the gas out of it. It is thirsty in a way that stone is not: it takes water back with enough heat to set fire to what it is packed in, and it does the same thing to anything wet it lands on. Handle it dry, handle it in gloves, and do not breathe it."},{id:"slaked_lime",name:"Slaked Lime",unit:"measure",tags:["alkaline","caustic","slaked","powdered"],kg:1.4,value:40,desc:"Quicklime that has already had its water and got the heat out of its system. Still caustic, no longer dangerous to keep, and it sets hard in air."},{id:"plaster",name:"Plaster",unit:"measure",tags:["salt","calcined","powdered","hygroscopic"],kg:1,value:30,desc:"Calcined gypsum. Add water, get four minutes, then get stone. Casts, moulds, seals, and one or two things nobody has told the dungeon about yet."},{id:"charcoal",name:"Charcoal",unit:"sack",tags:["organic","combustible","granular","purified"],kg:2,value:22,desc:"Wood cooked without air until only the carbon is left. Burns hotter and cleaner than what it was made from, which is the only reason anybody ever smelted anything."},{id:"lye",name:"Lye",unit:"flask",tags:["alkaline","caustic","reactive"],kg:1.2,value:48,desc:"Ash, leached with water and boiled down. It saponifies fat, it strips paint, and it does not distinguish between those and skin."},{id:"acid",name:"Acid",unit:"flask",tags:["acidic","caustic","reactive","volatile"],kg:1.3,value:85,desc:"Roasted, condensed and caught in glass. Eats metal, eats stone slowly, eats you quickly, and fumes the whole time it is doing it."},{id:"metal_fuel",name:"Metal Powder",unit:"measure",tags:["metal","powdered","reactive","combustible"],kg:.8,value:70,desc:"A reactive metal taken down to a dust. In a sheet it is a window frame. At this particle size the same metal has enough surface that it stops behaving like a metal and starts behaving like a fuel."},{id:"oxide_fines",name:"Oxide Fines",unit:"measure",tags:["oxide","powdered","oxidiser","granular"],kg:.9,value:45,desc:"Iron scale ground to a flour. It is carrying oxygen, it is not carrying anything else, and it is looking for something hungrier than iron to give it to."},{id:"black_powder",name:"Milled Powder",unit:"measure",tags:["oxidiser","combustible","granular","powdered"],kg:1,value:60,desc:"Nitre, charcoal and sulphur, milled wet and dried in a thin layer well away from anything you are fond of. The oldest thing on this list by five hundred years."},{id:"glass_stock",name:"Worked Glass",unit:"vessel",tags:["silicate","brittle","refractory","purified"],kg:.8,value:55,desc:"Cullet remelted into something that holds a liquid you would not put in a metal pot. The reason an alchemy bench is glassware and not saucepans."},{id:"pig_iron",name:"Pig Iron",unit:"ingot",tags:["metal","dense","malleable","purified"],kg:4,value:95,desc:"Ore and charcoal and a great deal of air, held long enough that the metal runs out of the bottom. Brittle, useful, and the start of everything sharp."},{id:"sand",name:"Sand",unit:
