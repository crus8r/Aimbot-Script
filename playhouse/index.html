<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0a0c12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Playhouse — script to screen</title>
<style>
  :root {
    --bg: #07080c;
    --panel: #12141c;
    --panel-2: #191c26;
    --line: #2a2e3c;
    --ink: #e8e6e0;
    --ink-dim: #9a9aa8;
    --accent: #e0a850;
    --accent-2: #7fa8d8;
    --safe-b: env(safe-area-inset-bottom, 0px);
    --safe-t: env(safe-area-inset-top, 0px);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    overscroll-behavior: none; touch-action: manipulation;
  }

  #app { position: fixed; inset: 0; display: flex; flex-direction: column; }

  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- chrome ---------- */
  #chrome {
    position: absolute; inset: 0; pointer-events: none;
    display: flex; flex-direction: column; justify-content: space-between;
    transition: opacity .35s ease;
  }
  #chrome.hidden { opacity: 0; }

  header {
    pointer-events: auto;
    padding: calc(var(--safe-t) + 10px) 12px 10px;
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, rgba(0,0,0,.72), rgba(0,0,0,0));
  }
  .title { font-size: 13px; font-weight: 600; letter-spacing: .04em; }
  .slate {
    font-size: 10.5px; color: var(--ink-dim); letter-spacing: .10em;
    text-transform: uppercase; font-variant-numeric: tabular-nums;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .spacer { flex: 1; }

  .iconbtn {
    pointer-events: auto;
    width: 40px; height: 40px; flex: 0 0 40px;
    border-radius: 11px; border: 1px solid var(--line);
    background: rgba(18,20,28,.72); color: var(--ink);
    display: grid; place-items: center; font-size: 16px;
    backdrop-filter: blur(12px); cursor: pointer;
  }
  .iconbtn:active { background: rgba(40,44,58,.9); }
  .iconbtn.on { border-color: var(--accent); color: var(--accent); }

  /* ---------- captions ---------- */
  #captionWrap {
    pointer-events: none; padding: 0 16px 6px;
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    text-align: center; text-shadow: 0 2px 14px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9);
  }
  #speaker {
    font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
    color: var(--accent); font-weight: 700;
  }
  #caption {
    font-size: 19px; line-height: 1.34; max-width: 30ch; font-weight: 500;
  }
  #caption.lyric { font-style: italic; color: #f0e2c4; }
  #caption.action { font-size: 14px; color: #b8b4ac; font-style: italic; max-width: 40ch; }
  #caption:empty, #speaker:empty { display: none; }

  /* ---------- transport ---------- */
  #transport {
    pointer-events: auto;
    padding: 8px 12px calc(var(--safe-b) + 10px);
    background: linear-gradient(0deg, rgba(0,0,0,.82), rgba(0,0,0,0));
    display: flex; flex-direction: column; gap: 6px;
  }
  #scrub {
    position: relative; height: 26px; display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  #track {
    position: absolute; left: 0; right: 0; height: 4px; border-radius: 3px;
    background: rgba(255,255,255,.16); overflow: hidden;
  }
  #played { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--accent); }
  #knob {
    position: absolute; width: 15px; height: 15px; border-radius: 50%;
    background: var(--accent); left: 0; transform: translateX(-50%);
    box-shadow: 0 2px 8px rgba(0,0,0,.6);
  }
  #marks { position: absolute; left: 0; right: 0; height: 4px; }
  #marks i { position: absolute; top: -2px; width: 1.5px; height: 8px; background: rgba(255,255,255,.4); }

  #controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  #time { font-size: 11.5px; color: var(--ink-dim); font-variant-numeric: tabular-nums; min-width: 84px; }
  .tabs { display: flex; gap: 6px; margin-left: auto; }
  .tab {
    pointer-events: auto; padding: 7px 11px; border-radius: 9px; font-size: 12px;
    border: 1px solid var(--line); background: rgba(18,20,28,.72); color: var(--ink-dim);
    backdrop-filter: blur(12px); cursor: pointer; white-space: nowrap;
  }
  .tab.active { color: var(--bg); background: var(--accent); border-color: var(--accent); font-weight: 600; }

  /* ---------- sheet ---------- */
  #sheet {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 20;
    max-height: 82%; display: flex; flex-direction: column;
    background: var(--panel); border-top: 1px solid var(--line);
    border-radius: 18px 18px 0 0;
    transform: translateY(101%); transition: transform .32s cubic-bezier(.22,.9,.3,1);
    padding-bottom: var(--safe-b);
    box-shadow: 0 -18px 50px rgba(0,0,0,.6);
  }
  #sheet.open { transform: translateY(0); }
  #sheetHead {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px; border-bottom: 1px solid var(--line);
  }
  #sheetTitle { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
  #grab { width: 36px; height: 4px; border-radius: 3px; background: var(--line); margin: 8px auto 0; }
  #sheetBody { overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px 14px 20px; }

  textarea {
    width: 100%; min-height: 44vh; resize: vertical;
    background: var(--panel-2); color: var(--ink);
    border: 1px solid var(--line); border-radius: 11px; padding: 11px;
    font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin: 10px 0; }
  .btn {
    padding: 10px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
    border: 1px solid var(--line); background: var(--panel-2); color: var(--ink); cursor: pointer;
  }
  .btn.primary { background: var(--accent); color: #1a1408; border-color: var(--accent); }
  .btn:active { transform: translateY(1px); }
  .btn.small { padding: 7px 10px; font-size: 12px; font-weight: 500; }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn:disabled:active { transform: none; }

  .tab.note { color: var(--accent-2); border-color: #3a4356; }
  .tab.note.active { color: var(--bg); background: var(--accent); border-color: var(--accent); }

  .hint { font-size: 12px; color: var(--ink-dim); line-height: 1.5; }
  .hint code { background: var(--panel-2); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }

  .card {
    background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 11px; margin-bottom: 10px;
  }
  .card h4 { margin: 0 0 8px; font-size: 13px; letter-spacing: .05em; display: flex; align-items: center; gap: 8px; }
  .swatch { width: 14px; height: 14px; border-radius: 4px; border: 1px solid rgba(255,255,255,.2); }

  .field { display: flex; align-items: center; gap: 8px; margin: 7px 0; }
  .field label { font-size: 12px; color: var(--ink-dim); width: 74px; flex: 0 0 74px; }
  select, input[type=range], input[type=color] {
    flex: 1; background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px; font-size: 12.5px;
  }
  input[type=color] { padding: 2px; height: 32px; }
  input[type=range] { padding: 0; height: 28px; accent-color: var(--accent); }

  #waveform { width: 100%; height: 64px; border-radius: 9px; background: var(--panel-2); border: 1px solid var(--line); display: block; }

  .lyricrow {
    display: flex; align-items: center; gap: 8px; padding: 6px 0;
    border-bottom: 1px solid rgba(255,255,255,.05); font-size: 12.5px;
  }
  .lyricrow .t { font-variant-numeric: tabular-nums; color: var(--accent); width: 52px; flex: 0 0 52px; font-size: 11.5px; }
  .lyricrow .x { flex: 1; color: var(--ink); }

  #toast {
    position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%);
    background: rgba(20,22,30,.94); border: 1px solid var(--line);
    padding: 9px 14px; border-radius: 10px; font-size: 12.5px;
    opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 40;
    backdrop-filter: blur(10px); max-width: 80vw; text-align: center;
  }
  #toast.show { opacity: 1; }

  #boot {
    position: absolute; inset: 0; z-index: 50; display: grid; place-items: center;
    background: var(--bg); transition: opacity .5s; text-align: center; padding: 24px;
  }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot .mark { font-size: 12px; letter-spacing: .3em; color: var(--accent); text-transform: uppercase; }
  #boot .sub { font-size: 13px; color: var(--ink-dim); margin-top: 10px; }

  @media (min-width: 860px) {
    #caption { font-size: 23px; max-width: 34ch; }
    #sheet { left: auto; right: 12px; bottom: 12px; width: 400px; max-height: 78%; border-radius: 16px; border: 1px solid var(--line); }
    #sheet:not(.open) { transform: translateY(calc(100% + 24px)); }
  }
  @media (orientation: landscape) and (max-height: 480px) {
    #caption { font-size: 15px; }
    #captionWrap { padding-bottom: 2px; }
    textarea { min-height: 30vh; }
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <div id="chrome">
    <header>
      <div>
        <div class="title" id="prodTitle">Playhouse</div>
        <div class="slate" id="slate">—</div>
      </div>
      <div class="spacer"></div>
      <div class="iconbtn" id="btnLetterbox" title="Letterbox">▭</div>
      <div class="iconbtn" id="btnFull" title="Fullscreen">⛶</div>
    </header>

    <div class="spacer"></div>

    <div id="captionWrap">
      <div id="speaker"></div>
      <div id="caption"></div>
    </div>

    <div id="transport">
      <div id="scrub">
        <div id="track"><div id="played"></div></div>
        <div id="marks"></div>
        <div id="knob"></div>
      </div>
      <div id="controls">
        <div class="iconbtn" id="btnPlay">▶</div>
        <div id="time">0:00 / 0:00</div>
        <div class="tabs">
          <div class="tab note" data-panel="notes" id="btnNote">+ Note</div>
          <div class="tab" data-panel="script">Script</div>
          <div class="tab" data-panel="cast">Cast</div>
          <div class="tab" data-panel="audio">Audio</div>
          <div class="tab" data-panel="look">Look</div>
        </div>
      </div>
    </div>
  </div>

  <div id="sheet">
    <div id="grab"></div>
    <div id="sheetHead">
      <div id="sheetTitle">Script</div>
      <div class="spacer" style="flex:1"></div>
      <div class="iconbtn" id="btnCloseSheet" style="width:32px;height:32px;flex:0 0 32px;font-size:14px">✕</div>
    </div>
    <div id="sheetBody"></div>
  </div>

  <div id="toast"></div>

  <div id="boot">
    <div>
      <div class="mark">Playhouse</div>
      <div class="sub" id="bootMsg">Building the cast…</div>
    </div>
  </div>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
